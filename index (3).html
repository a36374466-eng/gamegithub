<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница Игрового Портала</title>
</head>
<body style="background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <!-- Ссылка, которая открывает игровой портал в новой вкладке -->
    <a href="games.html" target="_blank" style="
        font-family: 'Segoe UI', sans-serif; 
        color: #fff; 
        font-size: 24px; 
        font-weight: bold; 
        text-decoration: none;
        padding: 20px 40px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 50px;
        box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
        transition: transform 0.2s, box-shadow 0.2s;
    " onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 0 35px rgba(139, 92, 246, 0.8)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0 25px rgba(139, 92, 246, 0.6)';">
        🎮 Зарегистрироваться и открыть Игровой Зал
    </a>

</body>
</html>
